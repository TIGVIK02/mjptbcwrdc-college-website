<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · MJPTBCWRDC(W)</title>
  <link rel="icon" type="image/png" href="../assets/images/logo/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="page-hero"><div class="container"><h2>GALLERY</h2><p>College life and campus photographs</p></div></div>
    <section class="section">
      <div class="container">
        <div class="gallery-categories" id="gallery-categories" role="group" aria-label="Gallery categories"></div>
        <div class="gallery-carousel carousel" id="gallery-carousel" tabindex="0" aria-roledescription="carousel" aria-label="Gallery images">
          <div class="carousel-viewport"><div class="carousel-track" id="gallery-track"></div></div>
          <button class="carousel-control carousel-prev" type="button" aria-label="Previous gallery item">←</button><button class="carousel-control carousel-next" type="button" aria-label="Next gallery item">→</button>
        </div>
        <p class="empty-state" id="gallery-status" hidden>No gallery categories are available.</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/script.js"></script>
  <script src="../js/gallery.js?v=3"></script>
</body>
</html>
